<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 株式会社サンプル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">SAMPLE Corp.</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="services.html">サービス</a></li>
                <li><a href="about.html">会社概要</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2 class="section-title">お問い合わせ</h2>
        <form style="max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">お名前</label>
                <input type="text" style="width: 100%; padding: 10px; border: 1px solid #ddd;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">メールアドレス</label>
                <input type="email" style="width: 100%; padding: 10px; border: 1px solid #ddd;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">お問い合わせ内容</label>
                <textarea style="width: 100%; padding: 10px; border: 1px solid #ddd; height: 100px;"></textarea>
            </div>
            <button type="button" class="btn" style="border: none; cursor: pointer; width: 100%;">送信する</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 SAMPLE Corp.</p>
    </footer>
</body>
<script>
    // スマホ用メニューの開閉関数
    function toggleMenu() {
        const menu = document.getElementById('nav-menu');
        menu.classList.toggle('open');
    }
</script>
</html>
